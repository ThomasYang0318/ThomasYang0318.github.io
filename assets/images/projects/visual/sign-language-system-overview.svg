<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">ASL fingerspelling recognition system</title>
  <desc id="description">Thirty-six letter and digit gesture classes pass through image preprocessing, CNN features, spatial self-attention, and classification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="18%" r="68%">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".5"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#fff" stroke-opacity=".055"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" rx="48" fill="url(#bg)"/>
  <rect width="1600" height="1000" rx="48" fill="url(#glow)"/>
  <rect width="1600" height="1000" rx="48" fill="url(#grid)"/>

  <text x="108" y="126" fill="#93c5fd" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="5">COMPUTER VISION</text>
  <text x="108" y="210" fill="#f8fafc" font-family="Arial, sans-serif" font-size="70" font-weight="700">36 static gesture classes</text>
  <text x="108" y="264" fill="#94a3b8" font-family="Arial, sans-serif" font-size="30">ASL fingerspelling A-Z and digits 0-9</text>

  <g transform="translate(108 342)" filter="url(#shadow)">
    <rect width="360" height="430" rx="34" fill="#f8fafc"/>
    <text x="36" y="58" fill="#64748b" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">INPUT CLASSES</text>
    <g font-family="Arial, sans-serif" font-size="46" font-weight="700" text-anchor="middle" fill="#172033">
      <rect x="36" y="96" width="78" height="78" rx="18" fill="#dbeafe"/><text x="75" y="150">A</text>
      <rect x="141" y="96" width="78" height="78" rx="18" fill="#e2e8f0"/><text x="180" y="150">B</text>
      <rect x="246" y="96" width="78" height="78" rx="18" fill="#e2e8f0"/><text x="285" y="150">C</text>
      <rect x="36" y="201" width="78" height="78" rx="18" fill="#e2e8f0"/><text x="75" y="255">X</text>
      <rect x="141" y="201" width="78" height="78" rx="18" fill="#e2e8f0"/><text x="180" y="255">Y</text>
      <rect x="246" y="201" width="78" height="78" rx="18" fill="#bfdbfe"/><text x="285" y="255">Z</text>
      <rect x="36" y="306" width="78" height="78" rx="18" fill="#e2e8f0"/><text x="75" y="360">0</text>
      <rect x="141" y="306" width="78" height="78" rx="18" fill="#e2e8f0"/><text x="180" y="360">1</text>
      <rect x="246" y="306" width="78" height="78" rx="18" fill="#dbeafe"/><text x="285" y="360">9</text>
    </g>
  </g>

  <g fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round">
    <path d="M512 557H620"/><path d="m594 531 28 26-28 26"/>
  </g>
  <g transform="translate(666 386)" filter="url(#shadow)">
    <rect width="340" height="340" rx="170" fill="#1d4ed8"/>
    <circle cx="170" cy="170" r="124" fill="none" stroke="#93c5fd" stroke-opacity=".6" stroke-width="2"/>
    <circle cx="170" cy="170" r="78" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="2"/>
    <text x="170" y="156" fill="#dbeafe" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="4">CNN</text>
    <text x="170" y="199" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700">+ Attention</text>
  </g>
  <g fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round">
    <path d="M1052 557h108"/><path d="m1134 531 28 26-28 26"/>
  </g>
  <g transform="translate(1208 420)" filter="url(#shadow)">
    <rect width="284" height="274" rx="34" fill="#f8fafc"/>
    <text x="34" y="56" fill="#64748b" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="3">PREDICTION</text>
    <rect x="34" y="86" width="216" height="126" rx="24" fill="#dbeafe"/>
    <text x="142" y="172" fill="#172033" text-anchor="middle" font-family="Arial, sans-serif" font-size="88" font-weight="700">A</text>
    <text x="142" y="244" fill="#2563eb" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700">CLASS LABEL</text>
  </g>

  <text x="108" y="894" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="25">400 x 400 RGB input</text>
  <circle cx="430" cy="886" r="5" fill="#60a5fa"/>
  <text x="462" y="894" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="25">MATLAB</text>
  <circle cx="640" cy="886" r="5" fill="#60a5fa"/>
  <text x="672" y="894" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="25">Highest recorded validation accuracy: 94.00%</text>
</svg>
